<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Deep Forest Background -->
  <rect width="192" height="192" rx="36" fill="#202B26"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="96" cy="96" r="76" stroke="#B69A70" stroke-width="3" opacity="0.9"/>
  <circle cx="96" cy="96" r="68" stroke="#B69A70" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  
  <!-- Mau Narok Highland Contour -->
  <path d="M52 115 C66 92, 84 76, 96 76 C108 76, 126 92, 140 115" stroke="#B69A70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 115 C78 102, 88 94, 96 94 C104 94, 114 102, 124 115" stroke="#B69A70" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Golden Sun -->
  <circle cx="96" cy="58" r="9" fill="#B69A70"/>
  <line x1="96" y1="41" x2="96" y2="46" stroke="#B69A70" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="46" x2="88" y2="49" stroke="#B69A70" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="46" x2="104" y2="49" stroke="#B69A70" stroke-width="2" stroke-linecap="round"/>

  <!-- Baseline -->
  <line x1="48" y1="121" x2="144" y2="121" stroke="#B69A70" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Luxury Monogram -->
  <text x="96" y="146" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#E9E2D5" text-anchor="middle" letter-spacing="4">THE MAU</text>
  <text x="96" y="160" font-family="'Manrope', sans-serif" font-size="9" font-weight="500" fill="#B69A70" text-anchor="middle" letter-spacing="3">ESTATE</text>
</svg>
